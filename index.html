<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding:20px;
        }
        .wrap {
            background: #ffffff;
            padding:48px 32px;
            border-radius:16px;
            box-shadow:0 2px 12px rgba(0,0,0,0.08);
            text-align:center;
            max-width:420px;
            width:100%;
        }
        h1 {
            color:#1f2937;
            margin-bottom:32px;
            font-size:24px;
        }
        .jump-btn {
            display: inline-block;
            padding:14px 36px;
            background:#2563eb;
            color:#fff;
            text-decoration:none;
            border-radius:8px;
            font-size:16px;
        }
        .jump-btn:hover {
            background:#1d4ed8;
        }
        .input-box {
            width:100%;
            padding:12px 16px;
            border:1px solid #d1d5db;
            border-radius:8px;
            font-size:16px;
            margin-bottom:16px;
        }
        .submit-btn {
            width:100%;
            padding:12px;
            background:#2563eb;
            color:#fff;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }
        .submit-btn:hover {
            background:#1d4ed8;
        }
        .error-tip {
            color:#dc2626;
            margin:12px 0;
            display:none;
        }
        .tool-entry {
            display:none;
            margin-top:24px;
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1>实用小工具</h1>

    <!-- 密码登录区域 -->
    <div id="loginArea">
        <input class="input-box" id="pwdInput" type="password" placeholder="请输入访问密码">
        <p class="error-tip" id="errorTip">密码错误，请重新输入</p>
        <button class="submit-btn" onclick="checkPassword()">验证密码</button>
    </div>

    <!-- 验证通过后才显示工具入口 -->
    <div class="tool-entry" id="toolEntry">
        <a href="./tool.html" class="jump-btn">点击进入Excel对比工具</a>
    </div>
</div>

<script>
// 访问密码，自行修改这里
const PASSWORD = "123456";

function checkPassword(){
    const inputVal = document.getElementById('pwdInput').value.trim();
    const errorTip = document.getElementById('errorTip');
    const loginArea = document.getElementById('loginArea');
    const toolEntry = document.getElementById('toolEntry');

    if(inputVal === PASSWORD){
        // 密码正确：隐藏登录，显示工具入口
        loginArea.style.display = 'none';
        toolEntry.style.display = 'block';
    }else{
        // 密码错误
        errorTip.style.display = 'block';
    }
}

// 回车触发验证
document.getElementById('pwdInput').addEventListener('keydown',function(e){
    if(e.key === 'Enter') checkPassword();
})
</script>
</body>
</html>
