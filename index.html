<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding:20px;
        }
        .wrap {
            background: #ffffff;
            padding:48px 32px;
            border-radius:16px;
            box-shadow:0 2px 12px rgba(0,0,0,0.08);
            text-align:center;
            max-width:420px;
            width:100%;
        }
        h1 {
            color:#1f2937;
            margin-bottom:32px;
            font-size:24px;
        }
        .jump-btn {
            display: inline-block;
            padding:14px 36px;
            background:#2563eb;
            color:#fff;
            text-decoration:none;
            border-radius:8px;
            font-size:16px;
        }
        .jump-btn:hover {
            background:#1d4ed8;
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1>实用小工具</h1>
    <a href="./tool.html" class="jump-btn">点击进入Excel对比工具</a>
</div>
</body>
</html>
